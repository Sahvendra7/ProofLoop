[tool.ruff]
line-length = 120

target-version = "py312"
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008", "UP040", "E501"]  # long user-facing strings; formatter owns layout

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"scripts/**" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real YouCam API and spends units (opt-in: YOUCAM_LIVE=1)"]
addopts = "-q"
